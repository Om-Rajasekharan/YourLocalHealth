name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build production app
        run: npm run build

  verify-ml:
    name: Verify ML training data and model serving
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Generate synthetic training data
        run: python3 ml/generate_synthetic_checkins.py --rows 1500 --output data/synthetic_checkins.csv

      - name: Validate training data
        run: python ml/validate_training_data.py data/synthetic_checkins.csv

      - name: Train all symptom models
        run: python3 ml/train_symptom_model.py data/synthetic_checkins.csv --all-targets

      - name: Verify baseline comparison and calibration reporting
        run: |
          python3 -c "
          import json

          with open('ml/models/training_summary.json') as handle:
              summary = json.load(handle)

          trained = [r for r in summary['results'] if r['status'] == 'trained']
          assert len(trained) == 9, f'expected 9 trained targets, got {len(trained)}'

          for result in trained:
              baseline = result.get('baseline')
              assert baseline, f\"{result['target']} is missing a baseline comparison\"
              assert 'roc_auc_lift' in baseline, f\"{result['target']} baseline missing roc_auc_lift\"

              calibration = result.get('holdout_metrics', {}).get('calibration')
              assert calibration, f\"{result['target']} is missing holdout calibration reporting\"
              assert 'expected_calibration_error' in calibration, f\"{result['target']} missing expected_calibration_error\"

          print('All 9 targets report a baseline comparison and calibration.')
          "

      - name: Generate model report
        run: python3 ml/generate_model_report.py --output ml/model_report.md

      - name: Start model serving microservice
        run: |
          nohup uvicorn ml.serve_models:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health

      - name: Smoke-test predictions and SHAP explanations
        run: |
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"aqi": 4, "health_risk": "Moderate", "heat_risk": "Low", "uv_risk": "High"}' \
            -o predict_response.json
          python3 -c "
          import json

          with open('predict_response.json') as handle:
              payload = json.load(handle)

          predictions = payload['predictions']
          assert len(predictions) == 9, f'expected 9 targets, got {len(predictions)}'
          for target, result in predictions.items():
              assert result['probability'] is not None, f'{target} produced no probability'
              assert result.get('topDrivers'), f'{target} produced no SHAP top drivers'
          print('All 9 models produced predictions with SHAP explanations.')
          "

      - name: Print service log on failure
        if: failure()
        run: cat uvicorn.log
